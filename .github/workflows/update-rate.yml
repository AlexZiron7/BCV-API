name: Actualizar Tasa BCV

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      usd:
        description: 'Tasa USD manual (si el BCV esta caido)'
        required: false
        type: number
      eur:
        description: 'Tasa EUR manual (si el BCV esta caido)'
        required: false
        type: number

permissions:
  contents: write # Permiso crucial para que el bot pueda subir el archivo json al repo

env:
  # Forzar a las acciones internas de GitHub a correr bajo Node 24 y eliminar el warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24 # Actualizado a la versión más reciente recomendada por GitHub

    - name: Instalar dependencias
      run: npm install

    - name: Ejecutar Extractor
      run: npm start
      env:
        MANUAL_USD: ${{ inputs.usd || '' }}
        MANUAL_EUR: ${{ inputs.eur || '' }}

    - name: Confirmar y Guardar Cambios (Push)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Verificar si tasa.json cambió para evitar commits vacíos
        if git status --porcelain | grep -q "tasa.json"; then
          git add tasa.json
          git commit -m "Actualización automática: Tasa BCV 6:00 AM"
          git push
        else
          echo "La tasa no ha cambiado desde la última verificación."
        fi
